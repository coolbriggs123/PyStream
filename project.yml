name: PyStream

options:
  bundleIdPrefix: com.coolbriggs123
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  PyStream:
    type: application
    platform: iOS

    sources:
      - ios/LANRemote/LANRemoteApp.swift
      - ios/LANRemote/ContentView.swift
      - ios/LANRemote/RemoteWebView.swift

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coolbriggs123.pystream
        PRODUCT_NAME: PyStream
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES

    info:
      properties:
        CFBundleDisplayName: PyStream

        NSLocalNetworkUsageDescription: "PyStream connects to your Windows computer over your local network."

        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true

        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight