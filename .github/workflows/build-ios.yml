name: Build PyStream iOS

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PyStream
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Verify source files
        run: |
          echo "Checking Swift files..."

          test -f ios/LANRemote/LANRemoteApp.swift
          test -f ios/LANRemote/ContentView.swift
          test -f ios/LANRemote/RemoteWebView.swift

          echo "All Swift files found."

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml

          test -d PyStream.xcodeproj

          echo "Xcode project generated successfully."

      - name: Build iOS Simulator application
        run: |
          xcodebuild \
            -project PyStream.xcodeproj \
            -scheme PyStream \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator application
        uses: actions/upload-artifact@v4
        with:
          name: PyStream-iOS-Simulator
          path: build/Build/Products/Debug-iphonesimulator/PyStream.app
          if-no-files-found: error
          retention-days: 14