name: Build PyStream IPA

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PyStream IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build for physical iOS devices
        run: |
          xcodebuild \
            -project PyStream.xcodeproj \
            -scheme PyStream \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/PyStream.app \
            Payload/PyStream.app

          zip -r PyStream.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PyStream-IPA
          path: PyStream.ipa
          retention-days: 14